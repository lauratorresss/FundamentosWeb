<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strings</title>
    <script src="js/scripts.js" defer></script>
</head>

<body>

        <h2>1. Padronização de Nome</h2>
            <label for="nomeInput">Digite uma string de teste:</label>
            <input type="text" id="nomeInput" placeholder="Digite uma string de teste">
        <button id="btnFormat">Remover espaços vazios</button>
        <div id="resultadoOutput"></div>

        <h2>2. Verificação de domínio de e-mail</h2>
            <label for="emailInput">Digite um email teste:</label>
            <input type="text" id="emailInput" placeholder="Digite um email teste">
        <button id="btnVerificarEmail">Executar</button>
        <div id="resultadoEmailOutput"></div>
    
        <h2>3. Contagem de caracteres</h2>
            <label for="fraseContagemInput">Digite uma frase teste:</label>
            <input type="text" id="fraseContagemInput" placeholder="Digite uma frase teste">
        <button id="btnContarCaracteres">Executar</button>
        <div id="resultadoContagemOutput"></div>

        <h2>4. Busca de palavra</h2>
            <label for="mensagemBuscaInput">Digite uma frase teste:</label>
            <textarea id="mensagemBuscaInput" placeholder="Digite uma frase teste">Estou estudando JavaScript para desenvolver aplicações web.</textarea>
        <button id="btnBuscarPalavra">Executar</button>
        <div id="resultadoBuscaOutput"></div>

        <h2>5. Extração de nome de usuário</h2>
            <label for="emailExtracaoInput">Digite um nome teste:</label>
            <input type="text" id="emailExtracaoInput" placeholder="Digite um nome teste">
        <button id="btnExtrairUsuario">Executar</button>
        <div id="resultadoExtracaoOutput"></div>
    
        <h2>6. Substituição de informações</h2>
            <label for="mensagemSubstituicaoInput">Digite uma frase teste:</label>
            <textarea id="mensagemSubstituicaoInput" placeholder="Digite uma frase teste">Olá, João! Seja bem-vindo, João!</textarea>
        <button id="btnSubstituirInformacoes">Executar</button>
        <div class="result" id="resultadoSubstituicaoOutput"></div>

        <h2>7. Formatação de código de produto</h2>
            <label for="codigoProdutoInput">Digite um código de teste:</label>
            <input type="text" id="codigoProdutoInput" placeholder="Digite um código de teste">
        <button id="btnFormatarcodigo">Executar</button>
        <div class="result" id="resultadoCodigoOutput"></div>
  
        <h2>8. Inversão de uma string</h2>
            <label for="palavraInversaoInput">Digite uma frase teste:</label>
            <textarea id="palavraInversaoInput" placeholder="Digite uma frase teste">javascript</textarea>
        <button id="btnInverterString">Executar</button>
        <div class="result" id="resultadoInversaoOutput"></div>

        <h2>9. Análise de uma senha</h2>
            <label for="senhaAnáliseInput">Digite uma senha teste:</label>
            <input type="text" id="senhaAnáliseInput" placeholder="Digite uma senha teste">
        <button id="btnAnalisarSenha">Executar</button>
        <div class="result" id="resultadoSenhaOutput"></div>

        <h2>10. Formatação de nome completo</h2>
            <label for="nomeCompletoInput">Digite um nome teste:</label>
            <input type="text" id="nomeCompletoInput" placeholder="Digite um nome teste">
        <button id="btnFormatarNomeCompleto">Executar</button>
        <div class="result" id="resultadoNomeCompletoOutput"></div>
    
</body>
</html>
